<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Roblox verification | FIMA</title>
<link rel="stylesheet" href="/assets/css/account.css?v=20260621-3a50"><link rel="stylesheet" href="/assets/css/fima-design-system.css?v=20260928-2"><link rel="stylesheet" href="/assets/css/web-experience.css?v=20261009-2">
  </head>
<body data-fima-product="hub"><header class="account-header"><div class="nav"><a class="brand" href="/">FIMA</a><a href="/login" data-copy="back">Back to login</a></div></header>
<main class="shell auth-shell"><section class="auth-intro panel panel-pad"><p class="eyebrow">FIMA Account</p><h1 data-copy="title">Verify your Roblox account.</h1><p data-copy="intro">Add a temporary code to your Roblox profile description. Your Roblox password stays with Roblox.</p></section>
<section class="auth-card panel panel-pad"><form id="start"><label><span data-copy="username">Roblox username</span><input name="username" autocomplete="off" maxlength="20" required></label><button class="button" data-copy="start">Get verification code</button></form>
<form id="confirm" hidden><p data-copy="instruction">Copy this code into your Roblox profile description, save it, then verify here. The code expires after 10 minutes.</p><code id="proof" style="display:block;overflow-wrap:anywhere;user-select:all"></code><a id="profile" class="button secondary" target="_blank" rel="noopener noreferrer" data-copy="profile">Open Roblox profile</a>
<div id="passwords" hidden><label><span data-copy="password">New FIMA password</span><input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="200"></label><label><span data-copy="confirmPassword">Confirm password</span><input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="200"></label></div>
<button class="button" data-copy="verify">Verify and continue</button><button class="button secondary" id="restart" type="button" data-copy="restart">Use another code</button></form><p id="message" class="message" role="status" aria-live="polite"></p></section></main>
<script src="/assets/js/config.js"></script><script src="/assets/js/roblox-login.js" defer></script><script src="/assets/js/web-experience.js?v=20261009-1" defer></script>
  </body></html>
